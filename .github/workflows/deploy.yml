name: Deploy Astral SPA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Regenerate assets/books.js from SQLite
        run: python3 scripts/export_books.py

      - name: Stage publish directory
        run: |
          mkdir -p pub/assets
          cp index.html pub/
          cp -r assets/. pub/assets/
          printf 'User-agent: *\n' > pub/robots.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pub'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4